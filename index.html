<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WAD-324 | Mujeeb Arshad</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7f5;
            color: #1e293b;
            min-height: 100vh;
        }

        /* Header */
        header {
            background: #12372a;
            color: white;
            padding: 45px 8%;
        }

        .course-label {
            color: #a7f3d0;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 15px;
        }

        header h1 {
            font-size: clamp(28px, 5vw, 42px);
            margin-bottom: 12px;
        }

        header p {
            color: #d1e7dc;
            font-size: 15px;
            line-height: 1.6;
        }

        /* Main Content */
        main {
            max-width: 1050px;
            margin: 50px auto;
            padding: 0 25px;
        }

        .section-heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 25px;
        }

        .section-heading h2 {
            font-size: 24px;
        }

        .section-heading span {
            color: #64748b;
            font-size: 14px;
        }

        /* Assignment Cards */
        .assignments {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 20px;
        }

        .assignment-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            padding: 24px;
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            text-decoration: none;
            color: #1e293b;
            transition: 0.25s ease;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.03);
        }

        .assignment-card:hover {
            transform: translateY(-5px);
            border-color: #16a34a;
            box-shadow: 0 10px 25px rgba(22, 163, 74, 0.10);
        }

        .card-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .assignment-icon {
            width: 48px;
            height: 48px;
            display: grid;
            place-items: center;
            background: #dcfce7;
            color: #166534;
            border-radius: 10px;
            font-size: 21px;
            font-weight: bold;
            flex-shrink: 0;
        }

        .assignment-info h3 {
            font-size: 16px;
            margin-bottom: 6px;
        }

        .assignment-info p {
            font-size: 13px;
            color: #64748b;
        }

        .arrow {
            font-size: 22px;
            color: #16a34a;
            transition: 0.25s;
        }

        .assignment-card:hover .arrow {
            transform: translateX(5px);
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 30px 15px;
            color: #64748b;
            font-size: 13px;
            margin-top: 60px;
            border-top: 1px solid #e2e8f0;
        }

        footer strong {
            color: #166534;
        }

        @media (max-width: 600px) {
            header {
                padding: 35px 7%;
            }

            main {
                margin-top: 35px;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="course-label">University Coursework</div>

        <h1>Web Application Development</h1>

        <p>
            Course: WAD-324<br>
            Student: Mujeeb Arshad
        </p>
    </header>

    <main>

        <div class="section-heading">
            <h2>My Assignments</h2>
            <span>Coursework Portfolio</span>
        </div>

        <div class="assignments">

            <!-- ADD NEW ASSIGNMENTS BELOW -->

            <a href="./Assignment_2/home.html" class="assignment-card" target="_blank">

                <div class="card-left">
                    <div class="assignment-icon">02</div>

                    <div class="assignment-info">
                        <h3>Assignment 02</h3>
                        <p>View submitted assignment</p>
                    </div>
                </div>

                <span class="arrow">→</span>
            </a>

            <!-- ADD NEW ASSIGNMENTS ABOVE -->

        </div>

    </main>

    <footer>
        <p>
            Developed by <strong>Mujeeb Arshad</strong>
            <br><br>
            WAD-324 | Web Application Development
        </p>
    </footer>

</body>

</html>
